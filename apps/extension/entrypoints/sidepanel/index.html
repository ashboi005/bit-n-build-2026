<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Over Money</title>
  </head>
  <body>
    <main>
      <header><strong>Mind Over Money</strong><button id="auth" type="button">Sign in</button></header>
      <p class="notice">Page context is local, temporary, and not evidence. Review before sending.</p>
      <p id="company-context" class="context" hidden></p>
      <label for="query">Your question</label>
      <textarea id="query" maxlength="2000" placeholder="Ask a question about the selected company."></textarea>
      <button id="analyze" type="button">Analyze</button>
      <p id="status" role="status"></p>
      <section id="results" aria-live="polite"></section>
      <footer>This is not a recommendation to buy or sell.</footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
